<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <a href="/safe">
    <animate attributeName="href" values="javascript:alert(1)" begin="0s" dur="0.1s" fill="freeze"/>
    <text x="50" y="50" font-size="24">Click me</text>
  </a>
  <a href="/safe">
    <set attributeName="href" to="javascript:alert(2)" begin="0s"/>
    <text x="50" y="100" font-size="24">Click me too</text>
  </a>
</svg>
